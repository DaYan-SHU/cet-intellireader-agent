[project]
name = "cet-intellireader-agent"
version = "0.1.0"
description = "基于 LangGraph + DeepSeek 的四六级英语阅读智能命题系统"
requires-python = ">=3.10"
dependencies = [
    "langchain-deepseek>=0.1.0",
    "langgraph>=0.2.0",
    "python-dotenv>=1.0.0",
    "python-docx>=1.0.0",
    "langchain-tavily>=0.1.0",
    "streamlit>=1.40",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.0",
]

[tool.uv]
package = false

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true
